<!DOCTYPE html>
<html lang="tg" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Бахш — Tajiks World</title>
  <link rel="icon" href="assets/img/ico.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="assets/js/app.js" defer></script>
</head>
<body class="font-sans bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased page-pad">
  <header id="site-header" class="sticky top-0 z-50"></header>
  <div id="site-drawer"></div>
  <main class="mx-auto max-w-7xl px-4 mt-8">
    <p class="text-xs uppercase tracking-wider text-slate-400">Бахш</p>
    <h1 id="cat-title" class="font-serif text-3xl sm:text-4xl font-bold mt-1"></h1>
    <p id="cat-empty" class="hidden mt-6 text-slate-500">Дар ин бахш ҳоло хабар нест.</p>
    <div id="grid" class="mt-6 grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </main>
  <div id="site-footer"></div>
  <div id="site-bottom"></div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const lang = TW.detectLang();
      const cat = new URLSearchParams(location.search).get("cat") || "tojikiston";
      const label = (TW_CATS[cat] && (TW_CATS[cat][lang] || TW_CATS[cat].tg)) || cat;
      document.getElementById("cat-title").textContent = label;
      document.title = label + " — Tajiks World";
      const items = TW_ARTICLES.filter(a => a.cat === cat);
      const grid = document.getElementById("grid");
      if (!items.length) document.getElementById("cat-empty").classList.remove("hidden");
      items.forEach(a => {
        grid.insertAdjacentHTML("beforeend", `<a href="article.html?id=${a.id}" class="group bg-white dark:bg-slate-900 rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-800"><div class="overflow-hidden h-44"><img src="assets/img/${a.img}" class="w-full h-full object-cover card-img" alt=""></div><div class="p-4"><h2 class="font-serif font-semibold leading-snug line-clamp-3">${a.title[lang] || a.title.tg}</h2><p class="text-sm text-slate-500 mt-2 line-clamp-2">${a.excerpt[lang] || a.excerpt.tg}</p></div></a>`);
      });
    });
  </script>
</body>
</html>
