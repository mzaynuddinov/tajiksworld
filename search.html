<!DOCTYPE html>
<html lang="tg" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ҷустуҷӯ — Tajiks World</title>
  <link rel="icon" href="assets/img/ico.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="assets/js/app.js" defer></script>
</head>
<body class="font-sans bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased page-pad">
  <header id="site-header" class="sticky top-0 z-50"></header>
  <div id="site-drawer"></div>
  <main class="mx-auto max-w-3xl px-4 mt-10">
    <h1 class="font-serif text-3xl font-bold">Ҷустуҷӯ</h1>
    <form id="form" class="mt-5 flex gap-2">
      <input id="q" type="search" autofocus class="flex-1 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-4 py-3 outline-none">
      <button class="rounded-xl bg-brand-navy text-white px-5 font-semibold">Ҷуст</button>
    </form>
    <p id="status" class="mt-4 text-sm text-slate-500"></p>
    <div id="results" class="mt-4 space-y-3"></div>
  </main>
  <div id="site-footer"></div>
  <div id="site-bottom"></div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const lang = TW.detectLang();
      const form = document.getElementById("form");
      const input = document.getElementById("q");
      const run = () => {
        const q = input.value.trim().toLowerCase();
        const box = document.getElementById("results");
        box.innerHTML = "";
        if (!q) { document.getElementById("status").textContent = ""; return; }
        const hits = TW_ARTICLES.filter(a => ((a.title.tg||'')+(a.title.fa||'')+(a.title.ru||'')+(a.title.en||'')+(a.excerpt.tg||'')+a.cat).toLowerCase().includes(q));
        document.getElementById("status").textContent = hits.length + " натиҷа";
        hits.forEach(a => {
          box.insertAdjacentHTML("beforeend", `<a href="article.html?id=${a.id}" class="block bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4"><h2 class="font-serif font-semibold">${a.title[lang] || a.title.tg}</h2><p class="text-sm text-slate-500 mt-1">${a.excerpt[lang] || a.excerpt.tg}</p></a>`);
        });
      };
      form.addEventListener("submit", (e) => { e.preventDefault(); run(); });
      input.addEventListener("input", run);
    });
  </script>
</body>
</html>
